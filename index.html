<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استمارة التقديم على الوظائف</title>
    <!-- مكتبة ضغط ومعالجة الـ PDF بداخل المتصفح -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .form-card {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            border: 1px solid #334155;
        }
        h2 {
            text-align: center;
            color: #38bdf8;
            margin-top: 0;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-top: 15px;
            font-size: 14px;
            color: #94a3b8;
        }
        .hint {
            font-size: 12px;
            color: #38bdf8;
            margin-top: 5px;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            box-sizing: border-box;
            font-size: 14px;
        }
        input[type="file"] {
            padding: 8px;
            background: #1e293b;
            cursor: pointer;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #38bdf8;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background: #0d9488;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: background 0.2s;
        }
        button:hover {
            background: #14b8a6;
        }
        button:disabled {
            background: #475569;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="form-card">
    <h2>تقديم طلب توظيف</h2>
    <form id="applyForm">
        <label>🖼️ رفع الصورة الشخصية (اختياري)</label>
        <input type="file" id="photoFile" accept="image/*">

        <label>الاسم <span style="color:#ef4444">*</span></label>
        <input type="text" id="name" required placeholder="مثال: رمضان حسن احمد">

        <label>🌍 الجنسية</label>
        <input type="text" id="nationality" required placeholder="مثال: مصري">

        <label>رقم الجوال</label>
        <input type="tel" id="phone" placeholder="05xxxxxxxx">

        <label>الوظيفة المتقدم عليها <span style="color:#ef4444">*</span></label>
        <input type="text" id="jobTitle" required placeholder="مثال: مهندس تصميم داخلي">

        <label>📄 رفع السيرة الذاتية (ملف PDF) <span style="color:#ef4444">*</span></label>
        <input type="file" id="cvFile" accept=".pdf" required>

        <label>📁 رفع ملف الأعمال (Portfolio - اختياري)</label>
        <input type="file" id="portfolioFile" accept=".pdf,image/*">

        <div class="hint">⚡ يتم ضغط وتحسين حجم الملفات تلقائياً لسرعة الإرسال.</div>

        <button type="submit" id="submitBtn">إرسال الطلب</button>
    </form>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB_hSgJqz3REmSLVaa8XHC6z874xpwTags",
    authDomain: "applying-for-a-job-bf297.firebaseapp.com",
    databaseURL: "https://applying-for-a-job-bf297-default-rtdb.firebaseio.com",
    projectId: "applying-for-a-job-bf297",
    storageBucket: "applying-for-a-job-bf297.appspot.com",
    messagingSenderId: "247056217136",
    appId: "1:247056217136:web:407a197e219db579c7a9f5",
    measurementId: "G-1XG4K2JMJG"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // 1. دالة ضغط الصور برمجياً
  const compressImage = (file, maxWidth = 800, quality = 0.6) => {
    return new Promise((resolve) => {
      if (!file) return resolve('');
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = (event) => {
        const img = new Image();
        img.src = event.target.result;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;

          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          // إرجاع الصورة بصيغة JPEG مضغوطة
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
      };
    });
  };

  // 2. دالة ضغط وتقليل حجم ملفات الـ PDF
  const compressPDF = async (file) => {
    if (!file) return '';
    try {
      const arrayBuffer = await file.arrayBuffer();
      // إعادة إنشاء وبناء الـ PDF للحذف الضمني للبيانات الزائدة والمتاحة
      const pdfDoc = await PDFLib.PDFDocument.load(arrayBuffer, { ignoreEncryption: true });
      
      // حفظ النسخة المعالجة بحجم أصغر وبنية منظمة
      const compressedBytes = await pdfDoc.save({ useObjectStreams: true });
      
      // تحويل النتيجة إلى DataURL
      let binary = '';
      const bytes = new Uint8Array(compressedBytes);
      const len = bytes.byteLength;
      for (let i = 0; i < len; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return 'data:application/pdf;base64,' + window.btoa(binary);
    } catch (e) {
      console.warn("تعذر ضغط الـ PDF بشكل أعمق، سيتم استخدام الملف الأساسي:", e);
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
      });
    }
  };

  // 3. معالجة الإرسال
  document.getElementById('applyForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const submitBtn = document.getElementById('submitBtn');
    const cvInput = document.getElementById('cvFile').files[0];
    const photoInput = document.getElementById('photoFile').files[0];
    const portfolioInput = document.getElementById('portfolioFile').files[0];

    if (!cvInput) {
      alert("يرجى اختيار ملف السيرة الذاتية.");
      return;
    }

    submitBtn.disabled = true;
    submitBtn.innerText = "⏳ جاري ضغط الملفات ومعالجتها...";

    try {
      // ضغط الصورة
      const photoData = await compressImage(photoInput, 600, 0.6);

      // ضغط ملف السيرة الذاتية
      const cvData = await compressPDF(cvInput);

      // ضغط ملف الأعمال (سواء كان صورة أو PDF)
      let portfolioData = '';
      if (portfolioInput) {
        if (portfolioInput.type.startsWith('image/')) {
          portfolioData = await compressImage(portfolioInput, 1000, 0.6);
        } else {
          portfolioData = await compressPDF(portfolioInput);
        }
      }

      submitBtn.innerText = "📤 جاري حفظ البيانات...";

      // الحفظ في قاعدة البيانات
      await addDoc(collection(db, "applicants"), {
        name: document.getElementById('name').value,
        jobTitle: document.getElementById('jobTitle').value,
        nationality: document.getElementById('nationality').value,
        phone: document.getElementById('phone').value || '',
        
        cvLink: cvData,
        cvUrl: cvData,
        cv: cvData,

        portfolioLink: portfolioData,
        portfolioUrl: portfolioData,
        portfolio: portfolioData,

        photoLink: photoData,
        photoUrl: photoData,
        photo: photoData,

        createdAt: serverTimestamp()
      });

      alert("تمت عملية معالجة الضغط وإرسال الطلب بنجاح!");
      document.getElementById('applyForm').reset();

    } catch (error) {
      console.error("خطأ: ", error);
      alert("حدث خطأ أثناء الإرسال: " + error.message);
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerText = "إرسال الطلب";
    }
  });
</script>

</body>
</html>
