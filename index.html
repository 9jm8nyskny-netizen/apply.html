<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استمارة التقديم على الوظائف</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .form-card {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            border: 1px solid #334155;
        }
        h2 { text-align: center; color: #38bdf8; margin-top: 0; margin-bottom: 20px; }
        label { display: block; margin-top: 15px; font-size: 14px; color: #94a3b8; }
        .hint { font-size: 12px; color: #38bdf8; margin-top: 5px; }
        input {
            width: 100%; padding: 12px; margin-top: 6px; border-radius: 6px;
            border: 1px solid #334155; background: #0f172a; color: #fff; box-sizing: border-box; font-size: 14px;
        }
        input[type="file"] { padding: 8px; background: #1e293b; cursor: pointer; }
        button {
            width: 100%; padding: 12px; margin-top: 25px; background: #0d9488;
            color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px;
        }
        button:hover { background: #14b8a6; }
        button:disabled { background: #475569; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="form-card">
    <h2>تقديم طلب توظيف</h2>
    <form id="applyForm">
        <label>🖼️ رفع الصورة الشخصية (اختياري)</label>
        <input type="file" id="photoFile" accept="image/*">

        <label>الاسم <span style="color:#ef4444">*</span></label>
        <input type="text" id="name" required placeholder="مثال: رمضان حسن احمد">

        <label>🌍 الجنسية</label>
        <input type="text" id="nationality" required placeholder="مثال: مصري">

        <label>رقم الجوال</label>
        <input type="tel" id="phone" placeholder="05xxxxxxxx">

        <label>الوظيفة المتقدم عليها <span style="color:#ef4444">*</span></label>
        <input type="text" id="jobTitle" required placeholder="مثال: مهندس تصميم داخلي">

        <label>📄 رفع السيرة الذاتية (ملف PDF أو صورة) <span style="color:#ef4444">*</span></label>
        <input type="file" id="cvFile" accept=".pdf,image/*" required>

        <label>📁 رفع ملف الأعمال (Portfolio - اختياري)</label>
        <input type="file" id="portfolioFile" accept=".pdf,image/*">

        <div class="hint">⚡ معالجة وتحسين المرفقات للفتح الفوري.</div>

        <button type="submit" id="submitBtn">إرسال الطلب</button>
    </form>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB_hSgJqz3REmSLVaa8XHC6z874xpwTags",
    authDomain: "applying-for-a-job-bf297.firebaseapp.com",
    databaseURL: "https://applying-for-a-job-bf297-default-rtdb.firebaseio.com",
    projectId: "applying-for-a-job-bf297",
    storageBucket: "applying-for-a-job-bf297.appspot.com",
    messagingSenderId: "247056217136",
    appId: "1:247056217136:web:407a197e219db579c7a9f5",
    measurementId: "G-1XG4K2JMJG"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  // معالجة وتحسين أبعاد الصورة لمنع تعليق المتصفح والشاشة السوداء
  const processFileOptimized = async (file) => {
    if (!file) return '';

    if (file.type.startsWith('image/')) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const maxDimension = 1200;
            let width = img.width;
            let height = img.height;

            if (width > height && width > maxDimension) {
              height = Math.round((height * maxDimension) / width);
              width = maxDimension;
            } else if (height > maxDimension) {
              width = Math.round((width * maxDimension) / height);
              height = maxDimension;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.65));
          };
        };
      });
    }

    if (file.type.includes('pdf')) {
      try {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        const page = await pdf.getPage(1);
        
        const viewport = page.getViewport({ scale: 1.2 });
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        await page.render({ canvasContext: ctx, viewport: viewport }).promise;
        return canvas.toDataURL('image/jpeg', 0.65);
      } catch (e) {
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.readAsDataURL(file);
          reader.onload = () => resolve(reader.result);
        });
      }
    }
    return '';
  };

  document.getElementById('applyForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const submitBtn = document.getElementById('submitBtn');
    const cvInput = document.getElementById('cvFile').files[0];
    const photoInput = document.getElementById('photoFile').files[0];
    const portfolioInput = document.getElementById('portfolioFile').files[0];

    submitBtn.disabled = true;
    submitBtn.innerText = "⏳ جاري تحسين المرفقات للفتح الفوري...";

    try {
      const [photoData, cvData, portfolioData] = await Promise.all([
        processFileOptimized(photoInput),
        processFileOptimized(cvInput),
        processFileOptimized(portfolioInput)
      ]);

      submitBtn.innerText = "📤 جاري حفظ الطلب...";

      await addDoc(collection(db, "applicants"), {
        name: document.getElementById('name').value,
        jobTitle: document.getElementById('jobTitle').value,
        nationality: document.getElementById('nationality').value,
        phone: document.getElementById('phone').value || '',
        
        cvLink: cvData,
        cvUrl: cvData,
        cv: cvData,

        portfolioLink: portfolioData,
        portfolioUrl: portfolioData,
        portfolio: portfolioData,

        photoLink: photoData,
        photoUrl: photoData,
        photo: photoData,

        createdAt: serverTimestamp()
      });

      alert("تم إرسال الطلب والمرفقات بنجاح!");
      document.getElementById('applyForm').reset();

    } catch (error) {
      alert("حدث خطأ: " + error.message);
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerText = "إرسال الطلب";
    }
  });
</script>

</body>
</html>
