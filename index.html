<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استمارة التقديم على الوظائف</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .form-card {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            border: 1px solid #334155;
        }
        .top-bar { display: flex; justify-content: flex-end; margin-bottom: 10px; }
        .lang-switch {
            display: inline-flex; border: 1px solid #334155; border-radius: 8px; overflow: hidden;
        }
        .lang-switch button {
            width: auto; margin: 0; padding: 6px 14px; border-radius: 0;
            background: #0f172a; color: #94a3b8; font-size: 13px; font-weight: bold;
        }
        .lang-switch button:hover { background: #334155; }
        .lang-switch button.active { background: #0d9488; color: #fff; }
        h2 { text-align: center; color: #38bdf8; margin-top: 0; margin-bottom: 20px; }
        label { display: block; margin-top: 15px; font-size: 14px; color: #94a3b8; }
        .req { color: #ef4444; }
        .hint { font-size: 12px; color: #38bdf8; margin-top: 5px; }
        input, select {
            width: 100%; padding: 12px; margin-top: 6px; border-radius: 6px;
            border: 1px solid #334155; background: #0f172a; color: #fff; box-sizing: border-box; font-size: 14px;
        }
        select option {
            background-color: #0f172a;
            color: #fff;
        }
        input[type="file"] { padding: 8px; background: #1e293b; cursor: pointer; }
        #submitBtn {
            width: 100%; padding: 12px; margin-top: 25px; background: #0d9488;
            color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px;
        }
        #submitBtn:hover { background: #14b8a6; }
        #submitBtn:disabled { background: #475569; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="form-card">
    <div class="top-bar">
        <div class="lang-switch">
            <button type="button" id="langAr" data-lang="ar">العربية</button>
            <button type="button" id="langEn" data-lang="en">English</button>
        </div>
    </div>

    <h2 data-i18n="title">تقديم طلب توظيف</h2>
    <form id="applyForm">
        <label data-i18n="photo">🖼️ رفع الصورة الشخصية (اختياري)</label>
        <input type="file" id="photoFile" accept="image/*">

        <label><span data-i18n="name">الاسم</span> <span class="req">*</span></label>
        <input type="text" id="name" required>

        <label><span data-i18n="nationality">🌍 الجنسية</span> <span class="req">*</span></label>
        <input type="text" id="nationality" required>

        <label><span data-i18n="city">📍 في أي مدينة متواجد؟</span> <span class="req">*</span></label>
        <input type="text" id="city" required data-i18n-placeholder="cityPh" placeholder="مثال: جدة، الرياض">

        <label data-i18n="phone">رقم الجوال</label>
        <input type="tel" id="phone" placeholder="05xxxxxxxx">

        <label><span data-i18n="job">الوظيفة المتقدم عليها</span> <span class="req">*</span></label>
        <select id="jobTitle" required>
            <option value="" disabled selected data-i18n="jobPlaceholder">اختر الوظيفة...</option>
            <option value="محاسب" data-i18n="j1">محاسب</option>
            <option value="محاسب تكاليف" data-i18n="j2">محاسب تكاليف</option>
            <option value="مهندس تصميم داخلي" data-i18n="j3">مهندس تصميم داخلي</option>
            <option value="مهندس مدني" data-i18n="j4">مهندس مدني</option>
            <option value="مهندس معماري" data-i18n="j5">مهندس معماري</option>
            <option value="شيف مشويات" data-i18n="j6">شيف مشويات</option>
            <option value="شيف شواية" data-i18n="j7">شيف شواية</option>
        </select>

        <label><span data-i18n="cv">📄 رفع السيرة الذاتية (ملف PDF أو صورة)</span> <span class="req">*</span></label>
        <input type="file" id="cvFile" accept=".pdf,image/*" required>

        <label data-i18n="portfolio">📁 رفع ملف الأعمال (Portfolio - اختياري)</label>
        <input type="file" id="portfolioFile" accept=".pdf,image/*">

        <div class="hint" data-i18n="hint">⚡ معالجة وتحسين المرفقات للفتح الفوري.</div>

        <button type="submit" id="submitBtn" data-i18n="submit">إرسال الطلب</button>
    </form>
</div>

<script>
  // ===== Translations =====
  const translations = {
    ar: {
      pageTitle: "استمارة التقديم على الوظائف",
      title: "تقديم طلب توظيف",
      photo: "🖼️ رفع الصورة الشخصية (اختياري)",
      name: "الاسم",
      nationality: "🌍 الجنسية",
      city: "📍 في أي مدينة متواجد؟",
      cityPh: "مثال: جدة، الرياض",
      phone: "رقم الجوال",
      job: "الوظيفة المتقدم عليها",
      jobPlaceholder: "اختر الوظيفة...",
      j1: "محاسب",
      j2: "محاسب تكاليف",
      j3: "مهندس تصميم داخلي",
      j4: "مهندس مدني",
      j5: "مهندس معماري",
      j6: "شيف مشويات",
      j7: "شيف شواية",
      cv: "📄 رفع السيرة الذاتية (ملف PDF أو صورة)",
      portfolio: "📁 رفع ملف الأعمال (Portfolio - اختياري)",
      hint: "⚡ معالجة وتحسين المرفقات للفتح الفوري.",
      submit: "إرسال الطلب",
      processing: "⏳ جاري تحسين المرفقات للفتح الفوري...",
      saving: "📤 جاري حفظ الطلب...",
      success: "تم إرسال الطلب والمرفقات بنجاح!",
      error: "حدث خطأ: ",
      tooBig: "حجم المرفقات كبير جداً. الرجاء رفع ملفات أصغر أو تقليل عددها."
    },
    en: {
      pageTitle: "Job Application Form",
      title: "Job Application",
      photo: "🖼️ Upload personal photo (optional)",
      name: "Name",
      nationality: "🌍 Nationality",
      city: "📍 Which city are you in?",
      cityPh: "e.g. Jeddah, Riyadh",
      phone: "Mobile number",
      job: "Position applying for",
      jobPlaceholder: "Select a position...",
      j1: "Accountant",
      j2: "Cost Accountant",
      j3: "Interior Design Engineer",
      j4: "Civil Engineer",
      j5: "Architect",
      j6: "Grill Chef",
      j7: "Shawarma / Rotisserie Chef",
      cv: "📄 Upload CV (PDF or image)",
      portfolio: "📁 Upload portfolio (optional)",
      hint: "⚡ Attachments are optimized for instant opening.",
      submit: "Submit Application",
      processing: "⏳ Optimizing attachments...",
      saving: "📤 Saving application...",
      success: "Application and attachments submitted successfully!",
      error: "An error occurred: ",
      tooBig: "The attachments are too large. Please upload smaller files or fewer files."
    }
  };

  let currentLang = 'ar';
  try {
    const saved = localStorage.getItem('lang');
    if (saved === 'ar' || saved === 'en') currentLang = saved;
  } catch (e) {}

  const t = (key) => translations[currentLang][key];

  function applyLanguage(lang) {
    currentLang = lang;
    try { localStorage.setItem('lang', lang); } catch (e) {}

    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.title = t('pageTitle');

    document.querySelectorAll('[data-i18n]').forEach(el => {
      el.textContent = t(el.dataset.i18n);
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
      el.placeholder = t(el.dataset.i18nPlaceholder);
    });

    document.querySelectorAll('.lang-switch button').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.lang === lang);
    });
  }

  document.querySelectorAll('.lang-switch button').forEach(btn => {
    btn.addEventListener('click', () => applyLanguage(btn.dataset.lang));
  });

  applyLanguage(currentLang);
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB_hSgJqz3REmSLVaa8XHC6z874xpwTags",
    authDomain: "applying-for-a-job-bf297.firebaseapp.com",
    databaseURL: "https://applying-for-a-job-bf297-default-rtdb.firebaseio.com",
    projectId: "applying-for-a-job-bf297",
    storageBucket: "applying-for-a-job-bf297.appspot.com",
    messagingSenderId: "247056217136",
    appId: "1:247056217136:web:407a197e219db579c7a9f5",
    measurementId: "G-1XG4K2JMJG"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  // Firestore allows ~1,048,576 bytes per document. We keep all attachments
  // together under this budget (characters of base64) and leave room for the text fields.
  const TOTAL_BUDGET = 880000;
  const WEIGHTS = { photo: 1, cv: 4, portfolio: 3 };

  const loadImage = (file) => new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('IMAGE_LOAD')); };
    img.src = url;
  });

  // Shrinks the image step by step until it fits inside its size budget
  const fitToBudget = (source, srcW, srcH, budget) => {
    const steps = [[1400, 0.72], [1200, 0.65], [1000, 0.58], [850, 0.5], [700, 0.45], [560, 0.4], [450, 0.35]];
    let out = '';
    for (const [maxDim, quality] of steps) {
      const ratio = Math.min(1, maxDim / Math.max(srcW, srcH));
      const w = Math.max(1, Math.round(srcW * ratio));
      const h = Math.max(1, Math.round(srcH * ratio));
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(source, 0, 0, w, h);
      out = canvas.toDataURL('image/jpeg', quality);
      if (out.length <= budget) return out;
    }
    throw new Error('TOO_BIG');
  };

  const processFileOptimized = async (file, budget) => {
    if (!file) return '';

    if (file.type.startsWith('image/')) {
      const img = await loadImage(file);
      return fitToBudget(img, img.naturalWidth, img.naturalHeight, budget);
    }

    if (file.type.includes('pdf')) {
      try {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        const page = await pdf.getPage(1);
        const viewport = page.getViewport({ scale: 2 });
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.height = viewport.height;
        canvas.width = viewport.width;
        await page.render({ canvasContext: ctx, viewport: viewport }).promise;
        return fitToBudget(canvas, canvas.width, canvas.height, budget);
      } catch (e) {
        if (e.message === 'TOO_BIG') throw e;
        // fallback: raw file, only if it fits
        const raw = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => reject(new Error('READ'));
          reader.readAsDataURL(file);
        });
        if (raw.length > budget) throw new Error('TOO_BIG');
        return raw;
      }
    }
    return '';
  };

  document.getElementById('applyForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const submitBtn = document.getElementById('submitBtn');
    const cvInput = document.getElementById('cvFile').files[0];
    const photoInput = document.getElementById('photoFile').files[0];
    const portfolioInput = document.getElementById('portfolioFile').files[0];

    submitBtn.disabled = true;
    submitBtn.innerText = t('processing');

    try {
      // Split the size budget between the files that were actually uploaded
      const present = { photo: photoInput, cv: cvInput, portfolio: portfolioInput };
      const weightSum = Object.keys(present)
        .filter(k => present[k])
        .reduce((sum, k) => sum + WEIGHTS[k], 0) || 1;
      const budgetFor = (k) => Math.floor(TOTAL_BUDGET * WEIGHTS[k] / weightSum);

      const [photoData, cvData, portfolioData] = await Promise.all([
        processFileOptimized(photoInput, budgetFor('photo')),
        processFileOptimized(cvInput, budgetFor('cv')),
        processFileOptimized(portfolioInput, budgetFor('portfolio'))
      ]);

      submitBtn.innerText = t('saving');

      // Each file is stored ONCE (before, each was stored 3 times, which tripled the size).
      // jobTitle is always saved in Arabic (option value), whatever the display language.
      await addDoc(collection(db, "applicants"), {
        name: document.getElementById('name').value,
        jobTitle: document.getElementById('jobTitle').value,
        nationality: document.getElementById('nationality').value,
        city: document.getElementById('city').value,
        phone: document.getElementById('phone').value || '',

        cvLink: cvData,
        portfolioLink: portfolioData,
        photoLink: photoData,

        createdAt: serverTimestamp()
      });

      alert(t('success'));
      document.getElementById('applyForm').reset();

    } catch (error) {
      if (error.message === 'TOO_BIG') {
        alert(t('tooBig'));
      } else {
        alert(t('error') + error.message);
      }
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerText = t('submit');
    }
  });
</script>

</body>
</html>
