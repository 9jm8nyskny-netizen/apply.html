<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استمارة التقديم على الوظائف</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .form-card {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            border: 1px solid #334155;
        }
        h2 {
            text-align: center;
            color: #38bdf8;
            margin-top: 0;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-top: 15px;
            font-size: 14px;
            color: #94a3b8;
        }
        .hint {
            font-size: 12px;
            color: #f59e0b;
            margin-top: 4px;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            box-sizing: border-box;
            font-size: 14px;
        }
        input[type="file"] {
            padding: 8px;
            background: #1e293b;
            cursor: pointer;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #38bdf8;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background: #0d9488;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: background 0.2s;
        }
        button:hover {
            background: #14b8a6;
        }
        button:disabled {
            background: #475569;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="form-card">
    <h2>تقديم طلب توظيف</h2>
    <form id="applyForm">
        <label>🖼️ رفع الصورة الشخصية (اختياري)</label>
        <input type="file" id="photoFile" accept="image/*">

        <label>الاسم <span style="color:#ef4444">*</span></label>
        <input type="text" id="name" required placeholder="مثال: رمضان حسن احمد">

        <label>🌍 الجنسية</label>
        <input type="text" id="nationality" required placeholder="مثال: مصري">

        <label>رقم الجوال</label>
        <input type="tel" id="phone" placeholder="05xxxxxxxx">

        <label>الوظيفة المتقدم عليها <span style="color:#ef4444">*</span></label>
        <input type="text" id="jobTitle" required placeholder="مثال: مهندس تصميم داخلي">

        <label>📄 رفع السيرة الذاتية (ملف PDF) <span style="color:#ef4444">*</span></label>
        <input type="file" id="cvFile" accept=".pdf" required>

        <label>📁 رفع ملف الأعمال (Portfolio - اختياري)</label>
        <input type="file" id="portfolioFile" accept=".pdf,image/*">

        <div class="hint">💡 يُرجى التأكد أن المرفقات أحجامها مناسبة وسريعة التحميل.</div>

        <button type="submit" id="submitBtn">إرسال الطلب</button>
    </form>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB_hSgJqz3REmSLVaa8XHC6z874xpwTags",
    authDomain: "applying-for-a-job-bf297.firebaseapp.com",
    databaseURL: "https://applying-for-a-job-bf297-default-rtdb.firebaseio.com",
    projectId: "applying-for-a-job-bf297",
    storageBucket: "applying-for-a-job-bf297.appspot.com",
    messagingSenderId: "247056217136",
    appId: "1:247056217136:web:407a197e219db579c7a9f5",
    measurementId: "G-1XG4K2JMJG"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // دالة تحويل أي ملف لمسار نصي محفوظ
  const fileToDataURL = (file) => new Promise((resolve, reject) => {
    if (!file) return resolve('');
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = () => resolve(reader.result);
    reader.onerror = (error) => reject(error);
  });

  document.getElementById('applyForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const submitBtn = document.getElementById('submitBtn');
    const cvInput = document.getElementById('cvFile').files[0];
    const photoInput = document.getElementById('photoFile').files[0];
    const portfolioInput = document.getElementById('portfolioFile').files[0];

    if (!cvInput) {
      alert("يرجى اختيار ملف السيرة الذاتية.");
      return;
    }

    // فحص إجمالي الأحجام لضمان عدم تجاوز حدود القاعدة
    let totalSize = cvInput.size + (photoInput ? photoInput.size : 0) + (portfolioInput ? portfolioInput.size : 0);
    if (totalSize > 900 * 1024) {
      alert("إجمالي حجم الملفات المرفوعة كبير جداً.\nيرجى تقليل حجم المرفقات لضمان نجاح عملية الإرسال.");
      return;
    }

    submitBtn.disabled = true;
    submitBtn.innerText = "جاري رفع وإرسال البيانات...";

    try {
      // تحويل جميع الملفات المرفوعة إلى بيانات مخزنة
      const [cvData, photoData, portfolioData] = await Promise.all([
        fileToDataURL(cvInput),
        fileToDataURL(photoInput),
        fileToDataURL(portfolioInput)
      ]);

      await addDoc(collection(db, "applicants"), {
        name: document.getElementById('name').value,
        jobTitle: document.getElementById('jobTitle').value,
        nationality: document.getElementById('nationality').value,
        phone: document.getElementById('phone').value || '',
        
        // حفظ السيرة الذاتية
        cvLink: cvData,
        cvUrl: cvData,
        cv: cvData,

        // حفظ ملف الأعمال (Portfolio)
        portfolioLink: portfolioData,
        portfolioUrl: portfolioData,
        portfolio: portfolioData,

        // حفظ الصورة الشخصية
        photoLink: photoData,
        photoUrl: photoData,
        photo: photoData,

        createdAt: serverTimestamp()
      });

      alert("تم إرسال كافة المرفقات والطلب بنجاح!");
      document.getElementById('applyForm').reset();

    } catch (error) {
      console.error("خطأ: ", error);
      alert("حدث خطأ أثناء الحفظ: " + error.message);
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerText = "إرسال الطلب";
    }
  });
</script>

</body>
</html>
