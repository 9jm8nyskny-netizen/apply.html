<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استمارة التقديم على الوظائف</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .form-card {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            border: 1px solid #334155;
        }
        h2 {
            text-align: center;
            color: #38bdf8;
            margin-top: 0;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-top: 15px;
            font-size: 14px;
            color: #94a3b8;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            box-sizing: border-box;
            font-size: 14px;
        }
        input[type="file"] {
            padding: 8px;
            background: #1e293b;
            cursor: pointer;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #38bdf8;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background: #0d9488;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: background 0.2s;
        }
        button:hover {
            background: #14b8a6;
        }
        button:disabled {
            background: #475569;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="form-card">
    <h2>تقديم طلب توظيف</h2>
    <form id="applyForm">
        <label>الاسم الكامل</label>
        <input type="text" id="name" required placeholder="مثال: محمد أحمد">

        <label>المسمى الوظيفي</label>
        <input type="text" id="jobTitle" required placeholder="مثال: مهندس مدني">

        <label>الجنسية</label>
        <input type="text" id="nationality" required placeholder="مثال: مصري / سوداني">

        <label>نبذة مختصرة</label>
        <textarea id="bio" rows="3" placeholder="اكتب نبذة مختصرة عن خبراتك..."></textarea>

        <label>رفع السيرة الذاتية (ملف PDF)</label>
        <input type="file" id="cvFile" accept=".pdf" required>

        <label>رابط الصورة الشخصية (اختياري)</label>
        <input type="url" id="photoLink" placeholder="رابط صورة مباشر أو من Drive">

        <button type="submit" id="submitBtn">إرسال الطلب</button>
    </form>
</div>

<!-- نموذج خفي وإطار خفي لرفع الملفات بدون مشكلة CORS -->
<iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>
<form id="driveUploadForm" method="POST" action="https://script.google.com/macros/s/AKfycbwoEAKNTDKDrSnqJjHHdCA8bQ-BPvP-040zAqbxT5Vw8WjL5XOw5K2EqoQOZIMu40f8AA/exec" target="hidden_iframe" style="display:none;">
    <input type="hidden" name="file" id="drive_file">
    <input type="hidden" name="fileName" id="drive_fileName">
    <input type="hidden" name="mimeType" id="drive_mimeType">
</form>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB_hSgJqz3REmSLVaa8XHC6z874xpwTags",
    authDomain: "applying-for-a-job-bf297.firebaseapp.com",
    databaseURL: "https://applying-for-a-job-bf297-default-rtdb.firebaseio.com",
    projectId: "applying-for-a-job-bf297",
    storageBucket: "applying-for-a-job-bf297.firebasestorage.app",
    messagingSenderId: "247056217136",
    appId: "1:247056217136:web:407a197e219db579c7a9f5",
    measurementId: "G-1XG4K2JMJG"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const fileToBase64 = (file) => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = () => resolve(reader.result);
    reader.onerror = (error) => reject(error);
  });

  let currentResolve = null;

  // الاستماع لانتهاء عملية الرفع بداخل الإطار الخفي
  document.getElementById('hidden_iframe').addEventListener('load', function() {
    if (currentResolve) {
      currentResolve();
    }
  });

  document.getElementById('applyForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const submitBtn = document.getElementById('submitBtn');
    const fileInput = document.getElementById('cvFile');
    const file = fileInput.files[0];

    if (!file) {
      alert("يرجى اختيار ملف السيرة الذاتية (PDF).");
      return;
    }

    submitBtn.disabled = true;
    submitBtn.innerText = "جاري رفع الملف إلى Google Drive...";

    try {
      const base64File = await fileToBase64(file);
      const fileName = `${document.getElementById('name').value}_CV.pdf`;

      // تعبئة النموذج الخفي
      document.getElementById('drive_file').value = base64File;
      document.getElementById('drive_fileName').value = fileName;
      document.getElementById('drive_mimeType').value = file.type;

      // إرسال الملف عبر النموذج الخفي لتفادي حظر الشبكة
      const uploadPromise = new Promise((resolve) => {
        currentResolve = resolve;
        document.getElementById('driveUploadForm').submit();
      });

      await uploadPromise;

      submitBtn.innerText = "جاري حفظ الطلب...";

      // بعد رفع الملف، نحفظ رابط المجلد مع اسم الملف المباشر
      // تم إتاحة الوصول للملف بداخل المجلد
      const searchDriveUrl = `https://drive.google.com/drive/u/0/folders/1dfpQzM5wFPj6pRp7Pe9o83CqwHcB1Cda`;

      await addDoc(collection(db, "applicants"), {
        name: document.getElementById('name').value,
        jobTitle: document.getElementById('jobTitle').value,
        nationality: document.getElementById('nationality').value,
        bio: document.getElementById('bio').value,
        cvLink: searchDriveUrl,
        cvFileName: fileName,
        photoLink: document.getElementById('photoLink').value || '',
        createdAt: serverTimestamp()
      });

      alert("تم إرسال الطلب ورفع السيرة الذاتية بنجاح إلى Google Drive!");
      document.getElementById('applyForm').reset();

    } catch (error) {
      console.error("خطأ: ", error);
      alert("حدث خطأ أثناء الإرسال: " + error.message);
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerText = "إرسال الطلب";
    }
  });
</script>

</body>
</html>
